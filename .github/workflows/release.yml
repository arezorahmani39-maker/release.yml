name: Release Yara

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r Yara_Windows_v0_2/requirements.txt

      - name: Build Yara
        shell: powershell
        run: |
          cd Yara_Windows_v0_2
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Yara app.py

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer
        shell: powershell
        run: |
          cd Yara_Windows_v0_2
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Yara v0.2.0
          generate_release_notes: true
          files: |
            Yara_Windows_v0_2/dist/Yara.exe
            Yara_Windows_v0_2/dist/Yara_Setup.exe
